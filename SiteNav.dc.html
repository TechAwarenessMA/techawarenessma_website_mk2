<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</helmet>
<nav style="display:flex;align-items:center;justify-content:space-between;padding:22px 56px;gap:24px;font-family:'Poppins',sans-serif;color:#2C3E50">
  <a href="Home.dc.html" style="display:flex;align-items:center;gap:12px;color:#2C3E50;text-decoration:none">
    <div style="width:40px;height:40px;border-radius:999px;background:#181818;color:#FAC206;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:0.813rem;letter-spacing:0.05em">TAA</div>
    <div style="font-size:0.75rem;font-weight:700;letter-spacing:0.14em;line-height:1.35;text-transform:uppercase">Tech Awareness<br>Association</div>
  </a>
  <div style="display:flex;align-items:center;gap:14px;font-size:0.875rem;font-weight:600">
    <a href="Home.dc.html" style="color:#2C3E50;text-decoration:none;border-bottom:2px solid {{ uHome }};padding-bottom:2px" style-hover="color:#D22B42">Home</a>
    <span style="opacity:0.3">/</span>
    <a href="Programs.dc.html" style="color:#2C3E50;text-decoration:none;border-bottom:2px solid {{ uPrograms }};padding-bottom:2px" style-hover="color:#D22B42">Programs</a>
    <span style="opacity:0.3">/</span>
    <a href="Chapters.dc.html" style="color:#2C3E50;text-decoration:none;border-bottom:2px solid {{ uChapters }};padding-bottom:2px" style-hover="color:#D22B42">Chapters</a>
    <span style="opacity:0.3">/</span>
    <a href="StartChapter.dc.html" style="color:#2C3E50;text-decoration:none;border-bottom:2px solid {{ uStart }};padding-bottom:2px" style-hover="color:#D22B42">Start a Chapter</a>
    <span style="opacity:0.3">/</span>
    <a href="GetInvolved.dc.html" style="color:#2C3E50;text-decoration:none;border-bottom:2px solid {{ uInvolved }};padding-bottom:2px" style-hover="color:#D22B42">Get Involved</a>
    <span style="opacity:0.3">/</span>
    <a href="Members.dc.html" style="color:#2C3E50;text-decoration:none;border-bottom:2px solid {{ uMembers }};padding-bottom:2px" style-hover="color:#D22B42">Members</a>
  </div>
  <a href="Donate.dc.html" style="background:#181818;color:#F8F3F1;padding:12px 26px;border-radius:999px;font-size:0.875rem;font-weight:600;text-decoration:none" style-hover="background:#D22B42;color:#F8F3F1">Donate</a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1200, &quot;height&quot;: 90}, &quot;active&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;home&quot;, &quot;programs&quot;, &quot;chapters&quot;, &quot;start&quot;, &quot;involved&quot;, &quot;members&quot;, &quot;none&quot;], &quot;default&quot;: &quot;none&quot;, &quot;tsType&quot;: &quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'none';
    const u = k => a === k ? '#D22B42' : 'transparent';
    return { uHome: u('home'), uPrograms: u('programs'), uChapters: u('chapters'), uStart: u('start'), uInvolved: u('involved'), uMembers: u('members') };
  }
}
</script>
</body>
</html>
